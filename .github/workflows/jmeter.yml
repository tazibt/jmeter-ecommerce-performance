name: JMeter

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  JMETER_VERSION: 5.6.3

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        id: cache-jmeter
        with:
          path: apache-jmeter-${{ env.JMETER_VERSION }}
          key: jmeter-${{ env.JMETER_VERSION }}

      # archive.apache.org est souvent très lent, on passe d'abord par le CDN
      - name: Installation de JMeter
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          f=apache-jmeter-$JMETER_VERSION.tgz
          curl -fsSL --max-time 120 https://dlcdn.apache.org/jmeter/binaries/$f -o $f \
            || curl -fsSL --max-time 300 https://archive.apache.org/dist/jmeter/binaries/$f -o $f
          tar xzf $f

      - run: echo "$PWD/apache-jmeter-$JMETER_VERSION/bin" >> $GITHUB_PATH

      - name: Tir de validation
        run: sh run.sh validation

      - name: Échec si erreurs
        run: |
          total=$(jq '.Total.sampleCount' results/validation/report/statistics.json)
          ko=$(jq '.Total.errorCount' results/validation/report/statistics.json)
          echo "$total échantillons, $ko en erreur"
          [ "$total" -gt 0 ] && [ "$ko" -eq 0 ]

      - name: Rapport HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-jmeter
          path: results/validation/
